android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.viewbinding=false
android.library.defaults.buildfeatures.androidresources=false
android.nonTransitiveRClass=true
android.uniquePackageNames=true
android.useAndroidX=true

kotlin.daemon.useFallbackStrategy=false

org.gradle.caching=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+ExitOnOutOfMemoryError -XX:MaxMetaspaceSize=1g -Xms1g -Xmx6g
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.parallel=true
org.gradle.priority=low
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true

org.gradle.unsafe.isolated-projects=true
ksp.project.isolation.enabled=true

voice.warningsAsErrors=true

# bVoice's version, shown in Settings: 0.4 = server books, pillow speaker,
# NFC tags, tags on the phone and the on/off switches; 0.5 = setup by QR code,
# nothing built in, review fixes. The code goes up by one with every release
# (F-Droid needs it, and fastlane/metadata/android/en-US/changelogs/CODE.txt).
bvoice.versionName=0.5.0
bvoice.versionCode=5
# The Voice release bVoice is built on, and how far past it (upstream commits):
# shown in Settings. Update it with every upstream merge.
bvoice.basedOnVoice=26.6.1+106
